name: Release

# Builds and publishes the GitHub Release for a vX.Y.Z tag:
#   - the source archive (xpi-X.Y.Z-source.tar.gz) and the standalone xpi binaries, built by Bun from that archive
#     for macOS, Linux and Windows (arm64 and x64), with SHA256SUMS
#   - each binary smoke-tested on Linux, macOS and Windows
#   - release notes generated by GitHub from the PRs merged since the previous tag
# npm is not published here: the owner runs `npm publish` by hand (2FA).
#
# `npm run release:tag` (scripts/release.mjs) pushes the tag once CI on main passed. To rebuild a tag whose run
# failed, run this workflow by hand with the tag; a published release is never changed.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v1.5.1'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${RELEASE_TAG} is not a vX.Y.Z tag."
            exit 1
          fi
          package_version="$(node -p 'require("./packages/xpi-coding-agent/package.json").version')"
          if [[ "${package_version}" != "${version}" ]]; then
            echo "::error::${RELEASE_TAG} points at a commit whose xpi-coding-agent is ${package_version}."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${RELEASE_TAG} points at a commit that is not on main."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Hydrate release model data
        run: npm run hydrate:model-data

      - name: Create source archive
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release-assets
          ./scripts/create-source-archive.sh \
            --version "${version}" \
            --ref HEAD \
            --out "release-assets/xpi-${version}-source.tar.gz"

      # Built from the archive, so the binaries are exactly what the source archive holds.
      - name: Build binaries from the source archive
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          build_root="$(mktemp -d)"
          trap 'rm -rf "${build_root}"' EXIT
          tar -xzf "release-assets/xpi-${version}-source.tar.gz" -C "${build_root}"
          "${build_root}/xpi-${version}/scripts/build-binaries.sh" \
            --offline-model-data \
            --out "${RUNNER_TEMP}/binaries"
          cp "${RUNNER_TEMP}"/binaries/xpi-*.tar.gz "${RUNNER_TEMP}"/binaries/xpi-*.zip release-assets/

      - name: Checksums
        run: |
          set -euo pipefail
          cd release-assets
          ls -l
          test "$(ls | wc -l)" -eq 7
          sha256sum -- * > SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout smoke tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Extract this platform's binary
        id: binary
        shell: bash
        run: |
          set -euo pipefail
          runtime_platform="$(node -p '`${process.platform}-${process.arch}`')"
          case "${runtime_platform}" in
            darwin-arm64|darwin-x64|linux-arm64|linux-x64)
              archive="release-assets/xpi-${runtime_platform}.tar.gz"
              binary="extracted/xpi/xpi"
              ;;
            win32-arm64|win32-x64)
              archive="release-assets/xpi-windows-${runtime_platform#win32-}.zip"
              binary="extracted/xpi.exe"
              ;;
            *)
              echo "::error::Unsupported runner platform ${runtime_platform}"
              exit 1
              ;;
          esac
          mkdir -p extracted
          if [[ "${archive}" == *.zip ]]; then
            export ARCHIVE_PATH="$(cygpath -w "${archive}")"
            export DESTINATION_PATH="$(cygpath -w extracted)"
            powershell.exe -NoProfile -NonInteractive -Command \
              'Expand-Archive -LiteralPath $env:ARCHIVE_PATH -DestinationPath $env:DESTINATION_PATH -Force'
          else
            tar -xf "${archive}" -C extracted
          fi
          echo "binary=${binary}" >> "${GITHUB_OUTPUT}"

      - name: Smoke-test the binary
        shell: bash
        env:
          BINARY: ${{ steps.binary.outputs.binary }}
        run: |
          set -euo pipefail
          "${BINARY}" --help > /dev/null
          version="$("${BINARY}" --version | tr -d '\r')"
          if [[ "${version}" != "${RELEASE_TAG#v}" ]]; then
            echo "::error::The binary reports version ${version}, not ${RELEASE_TAG#v}."
            exit 1
          fi
          node scripts/smoke-test-codemode-binary.mjs "${BINARY}"

  publish:
    needs:
      - build
      - smoke-test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Verify release assets
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS

      # The release is created as a draft and published only once every asset is on it, so a public release is
      # never missing files. A draft left by an earlier failed run is replaced; a published release is never touched.
      - name: Create the GitHub Release
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          existing="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published; it is not changed."
            exit 1
          fi
          if [[ "${existing}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi

          cat > install.md <<EOF
          ## Install

          - npm (published by hand, so it can lag the release a little): \`npm i -g xpi-coding-agent@${version}\`
          - Standalone binary, no Node.js needed: download the archive for your platform below and put \`xpi\` (\`xpi.exe\` on Windows) on your PATH. Check it against \`SHA256SUMS\`.
          EOF

          cd release-assets
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            --title "xpi ${RELEASE_TAG}" \
            --notes-file ../install.md \
            --generate-notes \
            ./*

          expected="$(ls | sort)"
          actual="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::The draft release's assets differ from the built ones."
            diff -u <(printf '%s\n' "${expected}") <(printf '%s\n' "${actual}") || true
            exit 1
          fi

          gh release edit "${RELEASE_TAG}" --draft=false

      - name: Delete the draft after a failure
        if: failure()
        run: |
          existing="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi
